backend:
  name: github
  repo: Dan-tech1/AEG-UM6SS
  branch: main
  base_url: https://phenomenal-dodol-901c07.netlify.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: fr

collections:
  - name: "blog"
    label: "Blog & Actualites"
    label_singular: "Article"
    folder: "data/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: json
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Auteur", name: "author", widget: "string", default: "Communication" }
      - label: "Categorie"
        name: "category"
        widget: "select"
        options:
          - "Vie Associative"
          - "Academique"
          - "Academique/Partenariat"
          - "Academique/formation"
          - "Culture"
          - "Sante"
          - "International"
      - { label: "Resume", name: "summary", widget: "text" }
      - { label: "Contenu complet", name: "content", widget: "markdown", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }

  - name: "events"
    label: "Evenements"
    label_singular: "Evenement"
    folder: "data/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: json
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string" }
      - { label: "Heure", name: "time", widget: "string" }
      - { label: "Lieu", name: "location", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Categorie"
        name: "category"
        widget: "select"
        options:
          - "Academique/formation"
          - "Vie Associative"
          - "Culture"
          - "Sante"
          - "International"
      - label: "Statut"
        name: "price"
        widget: "select"
        options:
          - "Gratuit"
          - "Payant"
          - "termine"
          - "A venir"
      - { label: "Info prix", name: "priceFor", widget: "string", required: false }

  - name: "team"
    label: "Equipe & Bureau"
    label_singular: "Membre"
    folder: "data/team"
    create: true
    slug: "{{name}}"
    format: json
    fields:
      - { label: "Nom complet", name: "name", widget: "string" }
      - { label: "Poste", name: "position", widget: "string" }
      - { label: "Photo", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "string" }

  - name: "activities"
    label: "Activites"
    label_singular: "Activite"
    folder: "data/activities"
    create: true
    slug: "{{slug}}"
    format: json
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Categorie"
        name: "category"
        widget: "select"
        options:
          - "Academique"
          - "Social"
          - "Culturel"
          - "Humanitaire"
          - "Sportif"

  - name: "partenaires"
    label: "Partenaires"
    label_singular: "Partenaire"
    folder: "data/partenaires"
    create: true
    slug: "{{name}}"
    format: json
    fields:
      - { label: "Nom", name: "name", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image", required: false }
      - { label: "Site web", name: "website", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Type de partenariat"
        name: "type"
        widget: "select"
        options:
          - "Academique"
          - "Institutionnel"
          - "Medical"
          - "Culturel"
          - "International"

  - name: "settings"
    label: "Parametres du site"
    files:
      - name: "general"
        label: "Informations generales"
        file: "data/settings.json"
        format: json
        fields:
          - { label: "Nom de l'association", name: "association_name", widget: "string", default: "AEG-UM6SS" }
          - { label: "Slogan", name: "tagline", widget: "string" }
          - { label: "Email de contact", name: "email", widget: "string" }
          - { label: "Telephone", name: "phone", widget: "string", required: false }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "WhatsApp", name: "whatsapp", widget: "string", required: false }
